name: Release
on:
  push:
    tags: [ "v*" ]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Win32
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32
      - name: Build Release
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/bin/Release/IGI-Offline-Trainer.exe package/
          Copy-Item README.md,LICENSE,LEGAL.md,THIRD_PARTY_NOTICES.md package/
          Compress-Archive package/* "IGI-Offline-Trainer-Windows-x86-${{ github.ref_name }}.zip"
          (Get-FileHash "IGI-Offline-Trainer-Windows-x86-${{ github.ref_name }}.zip" -Algorithm SHA256).Hash.ToLower() + "  IGI-Offline-Trainer-Windows-x86-${{ github.ref_name }}.zip" | Set-Content checksums-sha256.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            IGI-Offline-Trainer-Windows-x86-${{ github.ref_name }}.zip
            checksums-sha256.txt
