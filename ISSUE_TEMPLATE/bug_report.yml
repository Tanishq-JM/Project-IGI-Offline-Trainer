name: Bug report
description: Report a reproducible offline trainer problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach game files, private paths, tokens, or copyrighted assets.
  - type: input
    id: version
    attributes: { label: Trainer version }
    validations: { required: true }
  - type: input
    id: windows
    attributes: { label: Windows version }
    validations: { required: true }
  - type: dropdown
    id: state
    attributes:
      label: Failure area
      options: [Startup, Process attachment, Invincible, Magazine, Inventory, UI, Build]
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Reproduction steps }
    validations: { required: true }
