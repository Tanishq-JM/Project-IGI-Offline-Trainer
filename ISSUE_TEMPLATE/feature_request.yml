name: Feature request
description: Suggest an offline-only improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes: { label: Proposed improvement }
    validations: { required: true }
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request is exclusively for authorized offline single-player use.
          required: true
